name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-latest
          - target: darwin-arm64
            os: macos-latest
          - target: windows-amd64
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install xz-utils (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xz-utils

      - name: Debug AI token
        env:
          GH_TOKEN: ${{ secrets.AI_REPO_TOKEN }}
        run: |
          echo "token length: ${#GH_TOKEN}"
          echo "--- repo HEAD ---"
          curl -sI -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/machbase/neo-blackbox-ai | head -5
          echo "--- releases/latest ---"
          curl -s -o /tmp/r.json -w "HTTP %{http_code}\n" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/machbase/neo-blackbox-ai/releases/latest
          head -c 400 /tmp/r.json; echo
          echo "--- gh auth status ---"
          gh auth status 2>&1 || true

      - name: Fetch AI files
        env:
          GH_TOKEN: ${{ secrets.AI_REPO_TOKEN }}
        run: go run mage.go ai ${{ matrix.target }}

      - name: Fetch ffmpeg/ffprobe
        run: go run mage.go fetchFFmpeg ${{ matrix.target }}

      - name: Build package
        run: go run mage.go package ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neo-blackbox-${{ matrix.target }}
          path: |
            dist/neo-blackbox-${{ matrix.target }}.tar.gz
            dist/neo-blackbox-${{ matrix.target }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          # Collect all archive files (tar.gz for Linux/macOS, zip for Windows)
          FILES=()
          for f in artifacts/neo-blackbox-*/*.tar.gz artifacts/neo-blackbox-*/*.zip; do
            [ -e "$f" ] && FILES+=("$f")
          done

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${FILES[@]}" --clobber
          else
            gh release create "${TAG}" \
              --title "${TAG}" \
              --generate-notes \
              "${FILES[@]}"
          fi
